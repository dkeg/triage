name: Release

# Automated releases: bump VERSION, update CHANGELOG.md, commit, then push a matching tag:
#
#   git tag v$(cat VERSION) && git push origin v$(cat VERSION)
#
# The workflow tests, builds a universal app, signs it, notarizes it, publishes the GitHub release
# and updates the Homebrew cask. It stops (and publishes nothing) if notarization fails.
# It can also be run by hand from Actions > Release (it then releases the version in VERSION).
#
# Required repository secrets:
#   MACOS_CERT_P12_BASE64     Developer ID Application certificate + key, exported as .p12, base64
#   MACOS_CERT_PASSWORD       password of that .p12
#   NOTARY_APPLE_ID           Apple ID email used for notarization
#   NOTARY_PASSWORD           an app-specific password for that Apple ID (appleid.apple.com)
#   NOTARY_TEAM_ID            the Developer team id (Y8W7627T7W)
#   TAP_GITHUB_TOKEN          a token with write access to dkeg/homebrew-triage (updates the cask)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches VERSION
        run: |
          TAG="v$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($TAG)" >&2; exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Test
        run: swift test

      - name: Build, sign and notarize
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          REQUIRE_NOTARIZATION: "1"
        run: scripts/release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving its assets untouched."
          else
            gh release create "$RELEASE_TAG" dist/Triage-*.zip dist/Triage-*.zip.sha256 \
              --title "triage $RELEASE_TAG" --generate-notes
          fi

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          # Checksum of what users actually download (the published asset), not of this build.
          mkdir -p "$RUNNER_TEMP/asset"
          gh release download "$RELEASE_TAG" --pattern "Triage-${VERSION}.zip" --dir "$RUNNER_TEMP/asset" --clobber
          SHA="$(shasum -a 256 "$RUNNER_TEMP/asset/Triage-${VERSION}.zip" | awk '{print $1}')"
          TAP_TOKEN="$(printf '%s' "$TAP_TOKEN" | tr -d '[:space:]')"      # tolerate stray whitespace from pasting
          [ -n "$TAP_TOKEN" ] || { echo "TAP_GITHUB_TOKEN is empty" >&2; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64)"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" clone "https://github.com/dkeg/homebrew-triage.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          git config http.extraheader "AUTHORIZATION: basic ${AUTH}"
          sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/triage.rb
          if git diff --quiet; then echo "Cask already at ${VERSION} (${SHA})"; exit 0; fi
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "triage ${VERSION}"
          git push
